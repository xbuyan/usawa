<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Reset password — Usawa</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="topnav"><a href="/" class="brand">Usawa</a><nav></nav></div>
<div class="wrap" style="max-width:420px;margin-top:40px">
  <header class="masthead">
    <h1>Reset your password</h1>
    <p>Enter your email and we'll send you a reset link.</p>
  </header>

  <div class="panel">
    <div class="field" style="margin-bottom:14px">
      <label>Email</label>
      <input type="email" id="email" autocomplete="email">
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="submitBtn" style="width:100%">Send reset link</button>
    </div>
    <div class="error-box" id="errorBox" style="display:none;margin-top:12px"></div>
    <div class="csv-success" id="successBox" style="display:none;margin-top:12px"></div>
    <p style="font-size:13px;color:var(--ink-soft);margin-top:16px;text-align:center">
      <a href="/login">Back to log in</a>
    </p>
  </div>
</div>
<script src="{{ url_for('static', filename='forgot_password.js') }}"></script>
</body>
</html>
