<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="csrf-token" content="{{ csrf_token() }}">
<title>Set new password — Usawa</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="topnav"><a href="/" class="brand">Usawa</a><nav></nav></div>
<div class="wrap" style="max-width:420px;margin-top:40px">
  <header class="masthead">
    <h1>Set a new password</h1>
    <p>Choose a new password for your account.</p>
  </header>

  <div class="panel">
    <input type="hidden" id="token" value="{{ token }}">
    <div class="field" style="margin-bottom:6px">
      <label>New password</label>
      <input type="password" id="newPassword" autocomplete="new-password">
    </div>
    <p class="hint-text" style="margin-bottom:14px">At least 10 characters.</p>
    <div class="btn-row">
      <button class="btn-primary" id="submitBtn" style="width:100%">Update password</button>
    </div>
    <div class="error-box" id="errorBox" style="display:none;margin-top:12px"></div>
    <div class="csv-success" id="successBox" style="display:none;margin-top:12px"></div>
  </div>
</div>
<script src="{{ url_for('static', filename='reset_password.js') }}"></script>
</body>
</html>
