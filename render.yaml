databases:
  - name: usawa-db
    plan: free
    databaseName: usawa
    user: usawa

services:
  # Render's managed Redis-compatible key-value store. Required because
  # the web service runs 2 gunicorn workers (see startCommand below) —
  # Flask-Limiter's rate limiting only produces correct, shared counts
  # across workers when backed by Redis; the default in-memory storage
  # gives each worker its own counter, which was a real (not hypothetical)
  # gap in the previous deploy. Render's free-tier key-value plan is
  # sufficient for this — rate-limit counters are small and short-lived.
  - type: keyvalue
    name: usawa-redis
    plan: free
    ipAllowList: []

  - type: web
    name: usawa
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && FLASK_APP=app.py flask db upgrade
    startCommand: gunicorn app:app --workers 2 --worker-class gthread --threads 4 --timeout 120 --graceful-timeout 30 --access-logfile - --error-logfile -
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: usawa-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: usawa-redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
      # Optional — the app runs fine without these (Sentry monitoring and
      # real email sending are both off by default), but they're listed
      # here so they're discoverable in the Render dashboard when you're
      # ready to turn them on. Leave blank to skip.
      - key: SENTRY_DSN
        sync: false
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
